services:
  postgres:
    image: postgres:16-alpine
    container_name: playpk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playpk
      POSTGRES_PASSWORD: playpk
      POSTGRES_DB: playpk
    ports:
      - "5432:5432"
    volumes:
      - playpk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playpk -d playpk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: playpk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - playpk_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: redis-server --appendonly yes

volumes:
  playpk_postgres_data:
  playpk_redis_data:
